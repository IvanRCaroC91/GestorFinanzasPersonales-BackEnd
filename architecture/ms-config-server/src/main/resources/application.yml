server:
  port: ${PORT:8890}

spring:
  profiles:
    active: native
  application:
    name: ms-config-server
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:file:/app/config/config}
  # Configuración de seguridad básica (opcional, se puede agregar Spring Security después)
  security:
    user:
      name: ${CONFIG_SERVER_USER}
      password: ${CONFIG_SERVER_PASSWORD}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8765/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RAILWAY_STATIC_URL:localhost}
    prefer-ip-address: false
    non-secure-port: ${PORT:8890}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.config: INFO
    com.finanzas.config: INFO
