services:
  postgres:
    image: postgres:15-alpine
    container_name: finanzas-postgres
    restart: unless-stopped
    
    # Variables de entorno para la base de datos
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_HOST_AUTH_METHOD: trust
    
    # Exponer puerto para conexión local
    ports:
      - "5432:5432"
    
    # Volumen para persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montar scripts SQL para ejecución automática
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../database/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Configuración de red
    networks:
      - finanzas-network

  # Eureka Service Registry
  eureka:
    build:
      context: ..
      dockerfile: architecture/ms-service-registry/Dockerfile
    container_name: finanzas-eureka
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8765/eureka/}
    networks:
      - finanzas-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8765/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Config Server
  config-server:
    build:
      context: ..
      dockerfile: architecture/ms-config-server/Dockerfile
    container_name: finanzas-config
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8765/eureka/}
      - CONFIG_SERVER_GIT_URI=file:///config-repo
      - CONFIG_SERVER_USER=${CONFIG_SERVER_USER:-admin}
      - CONFIG_SERVER_PASSWORD=${CONFIG_SERVER_PASSWORD:-admin123}
    volumes:
      - ~/config-repo:/config-repo
    networks:
      - finanzas-network
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8890/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # API Gateway
  gateway:
    build:
      context: ..
      dockerfile: architecture/ms-api-gateway/Dockerfile
    container_name: finanzas-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8765/eureka/}
      - CONFIG_SERVER_URI=http://config-server:8890
      - CONFIG_SERVER_USERNAME=${CONFIG_SERVER_USER:-admin}
      - CONFIG_SERVER_PASSWORD=${CONFIG_SERVER_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
    networks:
      - finanzas-network
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Auth Service
  auth-service:
    build:
      context: ..
      dockerfile: business/ms-auth-service/Dockerfile
    container_name: finanzas-auth
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - CONFIG_SERVER_URI=http://config-server:8890
      - CONFIG_SERVER_USERNAME=${CONFIG_SERVER_USER:-admin}
      - CONFIG_SERVER_PASSWORD=${CONFIG_SERVER_PASSWORD:-admin123}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/finanzas_db}
      - DATABASE_USER=${DATABASE_USER:-admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8765/eureka/}
    networks:
      - finanzas-network
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>&1 | grep -q 'UP\\|403'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Finance Service
  finance-service:
    build:
      context: ..
      dockerfile: business/ms-finance-service/Dockerfile
    container_name: finanzas-finance
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - CONFIG_SERVER_URI=http://config-server:8890
      - CONFIG_SERVER_USERNAME=${CONFIG_SERVER_USER:-admin}
      - CONFIG_SERVER_PASSWORD=${CONFIG_SERVER_PASSWORD:-admin123}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/finanzas_db}
      - DATABASE_USER=${DATABASE_USER:-admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8765/eureka/}
    networks:
      - finanzas-network
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

# Volumen para persistencia de datos de PostgreSQL
volumes:
  postgres_data:
    driver: local

# Red personalizada para los servicios
networks:
  finanzas-network:
    driver: bridge
