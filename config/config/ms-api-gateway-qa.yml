# Configuración para ambiente QA
# NOTA: Este ambiente aún no existe. Ajustar los siguientes valores cuando se cree:
# - qa-eureka: Reemplazar con el hostname real del Eureka QA
# - https://qa-frontend.example.com: Reemplazar con la URL real del frontend QA
# - ${JWT_SECRET}: Variable de entorno con el secreto JWT para QA

server:
  port: 8080

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.vercel.app"
              # AJUSTAR: Reemplazar con la URL real del frontend QA
              - "https://qa-frontend.example.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: protected-routes
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/protected/**
        - id: finance-service
          uri: lb://ms-finance-service
          predicates:
            - Path=/api/v1/finance/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.finanzas.apigateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
