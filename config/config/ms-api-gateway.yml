server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      # Configuración CORS global para WebFlux
      globalcors:
        cors-configurations:
          '[/**]':
            # Orígenes permitidos (frontend local, Vercel y Railway)
            allowedOriginPatterns:
              - "https://*.vercel.app"
              - "https://*.railway.app"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            # Métodos HTTP permitidos
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            # Headers permitidos
            allowedHeaders:
              - "*"
            # Permitir credenciales (cookies, authorization headers)
            allowCredentials: false
            # Tiempo de cache para preflight OPTIONS
            maxAge: 3600
      # Configuración de rutas
      routes:
        - id: auth-service
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: protected-routes
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/protected/**
        - id: finance-service
          uri: lb://ms-finance-service
          predicates:
            - Path=/api/v1/finance/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RAILWAY_PUBLIC_DOMAIN:gateway}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.finanzas.apigateway: INFO

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuración JWT (debe coincidir con ms-auth-service)
jwt:
  secret: ${JWT_SECRET}
