server:
  port: 8080

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: protected-routes
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/protected/**
        - id: finance-service
          uri: lb://ms-finance-service
          predicates:
            - Path=/api/v1/finance/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8765/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.finanzas.apigateway: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,refresh
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
