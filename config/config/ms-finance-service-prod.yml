# Configuración para ambiente Producción
# NOTA: Este ambiente aún no existe. Ajustar los siguientes valores cuando se cree:
# - DATABASE_URL: URL de la base de datos de Producción
# - DATABASE_USER y DATABASE_PASSWORD: credenciales de la base de datos
# - EUREKA_URL: URL del Eureka de Producción

server:
  port: 8083

spring:
  application:
    name: ms-finance-service

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    default-property-inclusion: non_null

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.beans.factory: WARN
    org.springframework.context: WARN
    com.finanzas.finance: WARN
    org.springframework.jdbc: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
  
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    non-secure-port: 8083
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
