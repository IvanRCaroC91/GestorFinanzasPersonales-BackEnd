# Configuración para ambiente Producción
# NOTA: Este ambiente aún no existe. Ajustar los siguientes valores cuando se cree:
# - DATABASE_URL: URL de la base de datos de Producción
# - DATABASE_USER y DATABASE_PASSWORD: credenciales de la base de datos
# - EUREKA_URL: URL del Eureka de Producción
# - ${JWT_SECRET}: Variable de entorno con el secreto JWT para Producción

server:
  port: 8081

spring:
  application:
    name: ms-auth-service

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  data:
    jpa:
      repositories:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    non-secure-port: 8081
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    com.finanzas.auth: WARN
    org.springframework.cloud.netflix.eureka: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
