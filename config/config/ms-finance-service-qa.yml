# Configuración para ambiente QA
# NOTA: Este ambiente aún no existe. Ajustar los siguientes valores cuando se cree:
# - qa-db-host: Reemplazar con el hostname real de la base de datos QA
# - ${DB_USERNAME}: Variable de entorno con el usuario de base de datos QA
# - ${DB_PASSWORD}: Variable de entorno con la contraseña de base de datos QA
# - qa-eureka: Reemplazar con el hostname real del Eureka QA

server:
  port: 8083

spring:
  application:
    name: ms-finance-service

  datasource:
    # AJUSTAR: qa-db-host debe ser el hostname real de la base de datos QA
    url: jdbc:postgresql://qa-db-host:5432/finanzas_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    default-property-inclusion: non_null

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.beans.factory: INFO
    org.springframework.context: INFO
    com.finanzas.finance: INFO
    org.springframework.jdbc: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

eureka:
  client:
    service-url:
      # AJUSTAR: qa-eureka debe ser el hostname real del Eureka QA
      defaultZone: http://qa-eureka:8765/eureka
    register-with-eureka: true
    fetch-registry: true
  
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    non-secure-port: 8083
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
