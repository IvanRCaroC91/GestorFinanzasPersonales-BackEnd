# Configuración para ambiente Producción
# NOTA: Este ambiente aún no existe. Ajustar los siguientes valores cuando se cree:
# - prod-eureka: Reemplazar con el hostname real del Eureka Producción
# - https://prod-frontend.example.com: Reemplazar con la URL real del frontend Producción
# - ${JWT_SECRET}: Variable de entorno con el secreto JWT para Producción

server:
  port: 8080

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.vercel.app"
              - "https://*.railway.app"
              # AJUSTAR: Reemplazar con la URL real del frontend Producción
              - "https://prod-frontend.example.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: protected-routes
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/protected/**
        - id: finance-service
          uri: lb://ms-finance-service
          predicates:
            - Path=/api/v1/finance/**

eureka:
  client:
    service-url:
      # AJUSTAR: prod-eureka debe ser el hostname real del Eureka Producción
      defaultZone: http://prod-eureka:8765/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.finanzas.apigateway: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
