server:
  port: 8083

spring:
  application:
    name: ms-finance-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/finanzas_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    format_sql: true
  
  # Configuración para manejar tipos ENUM de PostgreSQL
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    # DEBUG para ver mappings de endpoints
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    
    # DEBUG para ver carga de beans y contexto
    org.springframework.beans.factory: DEBUG
    org.springframework.context: DEBUG
    
    # DEBUG para ver errores del controller
    com.finanzas.finance: DEBUG
    
    # DEBUG para ver errores de conexión a BD
    org.springframework.jdbc: DEBUG
    org.hibernate: DEBUG
    com.zaxxer.hikari: DEBUG

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
