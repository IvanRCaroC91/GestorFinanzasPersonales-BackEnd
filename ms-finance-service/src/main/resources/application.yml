server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-finance-service
  
  # Configuración de Base de Datos PostgreSQL compatible con Railway y Local
  datasource:
    # Railway: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    # Local: jdbc:postgresql://localhost:5432/finanzas_db
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:finanzas_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:admin123}}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    format_sql: true
  
  # Configuración para manejar tipos ENUM de PostgreSQL
  jackson:
    default-property-inclusion: non_null

  # Configuración MVC para manejo de errores 404
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    # INFO para producción
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    
    # INFO para ver carga de beans y contexto
    org.springframework.beans.factory: INFO
    org.springframework.context: INFO
    
    # INFO para ver errores del controller
    com.finanzas.finance: INFO
    
    # WARN para ver errores de conexión a BD
    org.springframework.jdbc: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  
  instance:
    hostname: ${RAILWAY_STATIC_URL:localhost}
    prefer-ip-address: false
    non-secure-port: ${PORT:8083}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
