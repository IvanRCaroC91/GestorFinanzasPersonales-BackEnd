spring:
  application:
    name: ms-finance-service
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8890}
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      label: main
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.5
