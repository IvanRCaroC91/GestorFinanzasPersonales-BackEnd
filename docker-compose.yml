services:
  postgres:
    image: postgres:15-alpine
    container_name: finanzas-postgres
    restart: unless-stopped
    
    # Variables de entorno para la base de datos
    environment:
      POSTGRES_DB: finanzas_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_HOST_AUTH_METHOD: trust
    
    # Exponer puerto para conexión local
    ports:
      - "5432:5432"
    
    # Volumen para persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montar scripts SQL para ejecución automática
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    
    # Configuración de red
    networks:
      - finanzas-network

  # Eureka Service Registry
  eureka:
    build:
      context: .
      dockerfile: ./ms-service-registry/Dockerfile
    container_name: finanzas-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - finanzas-network
    depends_on:
      - postgres

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: ./ms-api-gateway/Dockerfile
    container_name: finanzas-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - finanzas-network
    depends_on:
      - eureka

# Volumen para persistencia de datos de PostgreSQL
volumes:
  postgres_data:
    driver: local

# Red personalizada para los servicios
networks:
  finanzas-network:
    driver: bridge
