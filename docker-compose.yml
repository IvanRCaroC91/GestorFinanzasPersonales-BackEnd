services:
  postgres:
    image: postgres:15-alpine
    container_name: finanzas-postgres
    restart: unless-stopped
    
    # Variables de entorno para la base de datos
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_HOST_AUTH_METHOD: trust
    
    # Exponer puerto para conexión local
    ports:
      - "5432:5432"
    
    # Volumen para persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montar scripts SQL para ejecución automática
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    
    # Configuración de red
    networks:
      - finanzas-network

  # Eureka Service Registry
  eureka:
    build:
      context: .
      dockerfile: ./ms-service-registry/Dockerfile
    container_name: finanzas-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8761/eureka/}
    networks:
      - finanzas-network
    depends_on:
      - postgres

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: ./ms-api-gateway/Dockerfile
    container_name: finanzas-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
    networks:
      - finanzas-network
    depends_on:
      - eureka

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./ms-auth-service/Dockerfile
    container_name: finanzas-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/finanzas_db}
      - DATABASE_USER=${DATABASE_USER:-admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8761/eureka/}
    networks:
      - finanzas-network
    depends_on:
      - postgres
      - eureka

  # Finance Service
  finance-service:
    build:
      context: .
      dockerfile: ./ms-finance-service/Dockerfile
    container_name: finanzas-finance
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/finanzas_db}
      - DATABASE_USER=${DATABASE_USER:-admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin123}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_URL:-http://eureka:8761/eureka/}
    networks:
      - finanzas-network
    depends_on:
      - postgres
      - eureka

# Volumen para persistencia de datos de PostgreSQL
volumes:
  postgres_data:
    driver: local

# Red personalizada para los servicios
networks:
  finanzas-network:
    driver: bridge
