server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      # Configuración de rutas existente
      routes:
        - id: auth-service
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: protected-routes
          uri: lb://ms-auth-service
          predicates:
            - Path=/api/v1/protected/**
        - id: finance-service
          uri: lb://ms-finance-service
          predicates:
            - Path=/api/v1/finance/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RAILWAY_PUBLIC_DOMAIN:localhost}
    prefer-ip-address: false
    non-secure-port: ${PORT:8080}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.finanzas.apigateway: DEBUG

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuración JWT (debe coincidir con ms-auth-service)
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
